name: Set up Python 3
description: Sets up Python 3 environment for the workflow.

# Used to keep dependencies consistent across workflows.
runs:
  using: "composite"
  steps:
      - name: Set up Python 3
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt
