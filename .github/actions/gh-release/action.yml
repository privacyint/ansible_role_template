name: Publish GitHub release
description: Publish GitHub release using softprops/action-gh-release

# Used to keep dependencies consistent across workflows.
runs:
  using: "composite"
  steps:
    - name: Publish GitHub release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
      with:
        generate_release_notes: true
