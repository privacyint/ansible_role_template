---
name: CI - Lint and Molecule

x-checkout: &checkout actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
x-docker: &docker docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
x-python3: &python3 actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase
        uses: *checkout

      - name: Set up Python 3
        uses: *python3
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Configure development environment
        run: make configure

      - name: Run ansible lint checks
        run: make ansible-lint

  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase
        uses: *checkout

      - name: Set up Python 3
        uses: *python3
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Configure development environment
        run: make configure

      - name: Run yaml lint checks
        run: make yaml-lint

  molecule:
    name: Molecule - ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: alpine
            label: Alpine scenario
          - scenario: debian
            label: Debian scenario
    steps:
      - name: Check out the codebase
        uses: *checkout

      - name: Set up Python 3
        uses: *python3
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Configure development environment
        run: make configure

      - name: Set up Docker
        uses: *docker

      - name: Summarise test target
        run: |
          echo "Scenario: ${{ matrix.scenario }}"
          echo "Description: ${{ matrix.label }}"

      - name: Run Molecule test
        run: make test-scenario SCENARIO=${{ matrix.scenario }}
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
