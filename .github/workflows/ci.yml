---
name: CI - Lint and Molecule

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/checkout-codebase
      - uses: ./.github/actions/setup-python-3

      - name: Configure development environment
        run: make configure

      - name: Run ansible lint checks
        run: make ansible-lint

  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/checkout-codebase
      - uses: ./.github/actions/setup-python-3

      - name: Configure development environment
        run: make configure

      - name: Run yaml lint checks
        run: make yaml-lint

  molecule:
    name: Molecule - ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: alpine
            label: Alpine scenario
          - scenario: debian
            label: Debian scenario
    steps:
      - uses: ./.github/actions/checkout-codebase
      - uses: ./.github/actions/setup-python-3

      - name: Configure development environment
        run: make configure

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Summarise test target
        run: |
          echo "Scenario: ${{ matrix.scenario }}"
          echo "Description: ${{ matrix.label }}"

      - name: Run Molecule test
        run: make test-scenario SCENARIO=${{ matrix.scenario }}
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
