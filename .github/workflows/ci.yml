---
name: CI - Lint and Molecule

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Configure development environment
        run: make configure

      - name: Run lint checks
        run: make lint

  molecule:
    name: Molecule - ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: alpine
            label: Alpine scenario
          - scenario: debian
            label: Debian scenario
    steps:
      - name: Check out the codebase
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Configure development environment
        run: make configure

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Summarise test target
        run: |
          echo "Scenario: ${{ matrix.scenario }}"
          echo "Description: ${{ matrix.label }}"

      - name: Run Molecule test
        run: make test-scenario SCENARIO=${{ matrix.scenario }}
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
