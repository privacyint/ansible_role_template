---
name: Release to GitHub
description: Release the project to GitHub on version tags using GitHub Actions

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate before release
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/checkout-codebase
      - uses: ./.github/actions/setup-python-3

      - name: Configure development environment
        run: make configure

      - name: Run lint checks
        run: make lint

      - name: Run Molecule test suite
        run: make test

  create-release:
    name: Create GitHub release
    needs: validate
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/checkout-codebase
      - uses: ./.github/actions/gh-release
