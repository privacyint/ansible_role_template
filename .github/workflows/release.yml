---
name: Release to GitHub
description: Release the project to GitHub on version tags using GitHub Actions

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

x-checkout: &checkout actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
x-gh-release: &gh-release softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
x-python3: &python3 actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate before release
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase
        uses: *checkout

      - name: Set up Python 3
        uses: *python3
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Configure development environment
        run: make configure

      - name: Run lint checks
        run: make lint

      - name: Run Molecule test suite
        run: make test

  create-release:
    name: Create GitHub release
    needs: validate
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase
        uses: *checkout
        
      - name: Create GitHub release
        uses: *gh-release
