---
name: Security and dependency checks
description: Perform security audit of python dependencies and check Ansible dependency resolution on the project using GitHub Actions

on:
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - 'requirements*.txt'
      - 'requirements.yml'
      - 'molecule/**'
      - 'Makefile'
      - '.github/workflows/security-and-dependencies.yml'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ansible-dependency-resolution:
    name: Ansible dependency resolution
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      
      - name: Set up Python 3
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Configure the development environment, which installs all necessary dependencies
        run: make configure

      - name: Verify Ansible dependencies resolve
        run: |
          ./.venv/bin/ansible-galaxy role list --roles-path .ansible/roles || true
          ./.venv/bin/ansible-galaxy collection list --collections-path .ansible/collections || true

  python-dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    needs: ansible-dependency-resolution
    steps:
      - name: Check out the codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install dependency audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit

      - name: Audit Python development dependencies
        run: pip-audit --requirement requirements-dev.txt --desc
