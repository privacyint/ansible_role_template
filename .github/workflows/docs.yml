---
name: Documentation checks

on:
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - '**/*.md'
      - '.markdownlint*'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - '**/*.md'
      - '.markdownlint*'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

x-checkout: &checkout actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
x-node: &node actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.0.1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase
        uses: *checkout

      - name: Set up Node.js 20 environment
        uses: *node
        with:
            node-version: '20'

      - name: Run markdown lint checks
        run: npx --yes markdownlint-cli2 "**/*.md"
