---
name: Documentation checks

on:
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - '**/*.md'
      - '.markdownlint*'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - '**/*.md'
      - '.markdownlint*'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/checkout-codebase
      - uses: ./.github/actions/setup-node-20

      - name: Run markdown lint checks
        run: npx --yes markdownlint-cli2 "**/*.md"
