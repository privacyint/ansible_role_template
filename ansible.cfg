[defaults]
# Use the standard project-local Ansible cache layout.
roles_path = ./.ansible/roles:./molecule/shared/roles
collections_path = ./.ansible/collections

# Reduce gathering facts time for testing
gathering = smart
fact_caching = memory
fact_caching_timeout = 3600

# Display settings
stdout_callback = default
bin_ansible_callbacks = true

# Skip host key checking for test environments
host_key_checking = false

[galaxy]
# Timeout for Galaxy API requests
server_timeout = 10
