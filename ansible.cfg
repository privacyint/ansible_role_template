[defaults]
# Use local collections path
collections_path = ./.venv/collections:~/.ansible/collections:/usr/share/ansible/collections

# Reduce gathering facts time for testing
gathering = smart
fact_caching = memory
fact_caching_timeout = 3600

# Display settings
stdout_callback = yaml
bin_ansible_callbacks = true

# Skip host key checking for test environments
host_key_checking = false

[galaxy]
# Timeout for Galaxy API requests
server_timeout = 10
