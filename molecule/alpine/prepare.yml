---
- name: Prepare Alpine test environment
  hosts: all
  gather_facts: false
  tasks:
    - name: Install Python3, OpenRC, util-linux, and sudo
      ansible.builtin.raw: |
        apk update && apk add python3 openrc util-linux sudo
      changed_when: false

    - name: Ensure OpenRC is set up for Molecule (enables rc-service in test containers)
      become: true
      block:
        - name: Ensure /run/openrc directory exists
          ansible.builtin.file:
            path: /run/openrc
            state: directory
            mode: '0755'
            owner: root
            group: root

        - name: Ensure /run/openrc/softlevel file exists
          ansible.builtin.file:
            path: /run/openrc/softlevel
            state: touch
            mode: '0644'
            owner: root
            group: root

    - name: Gather facts
      ansible.builtin.setup:
