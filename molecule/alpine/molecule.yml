---
# Molecule configuration for Alpine (architecture follows the runner)
prerun: true

dependency:
  name: galaxy
  enabled: true
  options:
    no-cache: true
    role-file: molecule/shared/requirements.yml
    requirements-file: molecule/shared/requirements.yml
  env:
    ANSIBLE_COLLECTIONS_PATH: ${MOLECULE_PROJECT_DIRECTORY}/.ansible/collections
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/.ansible/roles

driver:
  name: docker

provisioner:
  name: ansible
  config_options:
    defaults:
      callbacks_enabled: ansible.posix.profile_tasks
      stdout_callback: default
  # Paths must be env vars: ansible-compat exports them, and env overrides ansible.cfg.
  env:
    ANSIBLE_COLLECTIONS_PATH: ${MOLECULE_PROJECT_DIRECTORY}/.ansible/collections
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/.ansible/roles

  playbooks:
    prepare: prepare.yml
    converge: ../shared/converge.yml
    verify: ../shared/verify.yml
  inventory:
    links:
      group_vars: ../group_vars/
      host_vars: host_vars/

platforms:
  - name: alpine
    image: alpine:3.24
    pre_build_image: true
    command: /sbin/init
    tmpfs:
      - /run
    # Uncomment the following lines to enable privileged mode and cgroup namespace support when the role is using nested containers
    # privileged: true
    # cgroupns_mode: host
    # volumes:
    #   - /sys/fs/cgroup:/sys/fs/cgroup:rw

verifier:
  name: ansible

scenario:
  name: alpine
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
