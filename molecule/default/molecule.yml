---
# Molecule configuration for Ansible role testing
dependency:
  name: galaxy
  enabled: true

driver:
  name: docker

provisioner:
  name: ansible
  config_options:
    defaults:
      callbacks_enabled: ansible.posix.profile_tasks
      stdout_callback: default
  inventory:
    links:
      group_vars: ../group_vars/

platforms:
  - name: default
    image: alpine:3.23
    platform: linux/amd64
    pre_build_image: true
    privileged: true
    command: /sbin/init
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run

verifier:
  name: ansible

scenario:
  name: default
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
