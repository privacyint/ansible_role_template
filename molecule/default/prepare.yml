---
- name: Prepare test environment
  hosts: all
  gather_facts: false
  tasks:
    - name: Install Python3 and OpenRC
      ansible.builtin.raw: |
        apk update && apk add python3 openrc util-linux sudo
      changed_when: false

    - name: Gather facts
      ansible.builtin.setup:

    - name: Ensure OpenRC is set up for Molecule (enables rc-service in test containers)
      ansible.builtin.shell: |
        mkdir -p /run/openrc
        touch /run/openrc/softlevel
        chmod 0755 /run/openrc
        chmod 0644 /run/openrc/softlevel
      when: ansible_facts['os_family'] == "Alpine"
      changed_when: false
