---
# Molecule configuration Debian 13
prerun: true

dependency:
  name: galaxy
  enabled: true
  options:
    role-file: molecule/shared/requirements.yml
    requirements-file: molecule/shared/requirements.yml
  env:
    ANSIBLE_COLLECTIONS_PATH: ${MOLECULE_PROJECT_DIRECTORY}/.ansible/collections
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/.ansible/roles

driver:
  name: docker

provisioner:
  name: ansible
  config_options:
    defaults:
      callbacks_enabled: ansible.posix.profile_tasks
      stdout_callback: default
  # Paths must be env vars: ansible-compat exports them, and env overrides ansible.cfg.
  env:
    ANSIBLE_COLLECTIONS_PATH: ${MOLECULE_PROJECT_DIRECTORY}/.ansible/collections
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/.ansible/roles

  playbooks:
    prepare: prepare.yml
    converge: ../shared/converge.yml
    verify: ../shared/verify.yml
  inventory:
    links:
      group_vars: ../group_vars/
      host_vars: host_vars/

platforms:
  - name: debian
    # Debian 13 with systemd support
    # `tag:latest` on 11th October 2026
    image: geerlingguy/docker-debian13-ansible@sha256:979c0d5e12b0035fff1c46bd4dfd00d67cd82fa48035194f14f32e01c8c02372
    pre_build_image: true
    command: /lib/systemd/systemd
    tmpfs:
      - /run
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

verifier:
  name: ansible

scenario:
  name: debian
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
